<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Minxu Liu — Ph.D. student at Zhejiang University College of Artificial Intelligence. Research: Neural Signal Processing, Audiovisual Representation, Affective Computing.">
  <meta property="og:title" content="Minxu Liu | 刘旻栩">
  <meta property="og:description" content="Ph.D. student at ZJU AI. Neural signals · Audiovisual representation · Affective computing.">
  <title>Minxu Liu</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- ── THEME SWITCHER ──────────────────────────────────── -->
  <div id="theme-panel">
    <button id="theme-toggle" title="Switch color theme">🎨</button>
    <div id="theme-grid" class="hidden">
      <div class="theme-label">Color Themes</div>
      <div class="theme-swatches">
        <button class="swatch active" data-theme="ivory"     title="Ivory &amp; Jade"><span style="background:#f9f7f4"></span><span style="background:#7aac96"></span><small>Ivory</small></button>
        <button class="swatch" data-theme="dark"             title="Deep Slate"><span style="background:#0d0f14"></span><span style="background:#6ee7f7"></span><small>Slate</small></button>
        <button class="swatch" data-theme="midnight"         title="Midnight Blue"><span style="background:#0f1523"></span><span style="background:#7eb8f7"></span><small>Midnight</small></button>
        <button class="swatch" data-theme="forest"           title="Forest &amp; Moss"><span style="background:#f4f7f4"></span><span style="background:#5a8c6a"></span><small>Forest</small></button>
        <button class="swatch" data-theme="rose"             title="Rose Quartz"><span style="background:#fdf6f6"></span><span style="background:#c4706b"></span><small>Rose</small></button>
        <button class="swatch" data-theme="obsidian"         title="Obsidian &amp; Gold"><span style="background:#131210"></span><span style="background:#c9a84c"></span><small>Obsidian</small></button>
        <button class="swatch" data-theme="arctic"           title="Arctic White"><span style="background:#f7f9fb"></span><span style="background:#4a90d9"></span><small>Arctic</small></button>
        <button class="swatch" data-theme="lavender"         title="Lavender Dusk"><span style="background:#f5f4fb"></span><span style="background:#7c6fc4"></span><small>Lavender</small></button>
        <button class="swatch" data-theme="sand"             title="Sand &amp; Terracotta"><span style="background:#faf5ee"></span><span style="background:#c46a3a"></span><small>Sand</small></button>
        <button class="swatch" data-theme="carbon"           title="Carbon &amp; Neon"><span style="background:#1a1a1a"></span><span style="background:#39ff90"></span><small>Carbon</small></button>
      </div>
    </div>
  </div>

  <!-- ── NAVIGATION ─────────────────────────────────────── -->
  <nav id="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="#"></a>
      <ul class="nav-links">
        <li><a href="#news">News</a></li>
        <li><a href="#publications">Research</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#awards">Awards</a></li>
      </ul>
    </div>
  </nav>

  <!-- ── HERO ───────────────────────────────────────────── -->
  <div class="page-wrap">
    <section id="hero">
      <div id="hero-content"></div>
      <div class="hero-photo-wrap" id="hero-photo"></div>
    </section>
  </div>

  <!-- ── STATS BAR ──────────────────────────────────────── -->
  <div class="page-wrap">
    <div id="stats-row" class="stats-row reveal"></div>
  </div>

  <!-- ── NEWS ───────────────────────────────────────────── -->
  <div class="page-wrap">
    <section id="news" class="section reveal">
      <div class="section-eyebrow">// Latest</div>
      <h2 class="section-title">News <em>&amp; Updates</em></h2>
      <div id="news-list" class="news-list"></div>
    </section>
  </div>

  <!-- ── PUBLICATIONS ───────────────────────────────────── -->
  <div class="page-wrap">
    <section id="publications" class="section">
      <div class="section-eyebrow">// Selected Works</div>
      <h2 class="section-title">Research <em>&amp; Publications</em></h2>
      <div id="publications-wrap"></div>
    </section>
  </div>

  <!-- ── EDUCATION ──────────────────────────────────────── -->
  <div class="page-wrap">
    <section id="education" class="section reveal">
      <div class="section-eyebrow">// Academic Background</div>
      <h2 class="section-title">Education</h2>
      <div id="education-list" class="edu-list"></div>
    </section>
  </div>

  <!-- ── AWARDS ─────────────────────────────────────────── -->
  <div class="page-wrap">
    <section id="awards" class="section reveal">
      <div class="section-eyebrow">// Recognition</div>
      <h2 class="section-title">Awards <em>&amp; Honors</em></h2>
      <div id="awards-grid" class="awards-grid"></div>
    </section>
  </div>

  <!-- ── FOOTER ─────────────────────────────────────────── -->
  <footer id="footer">
    <div id="footer-inner" class="footer-inner"></div>
  </footer>

  <script src="data/profile.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
